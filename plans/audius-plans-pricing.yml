description: >-
  Audius is a decentralized, open-source protocol. The public REST API is free and unauthenticated for
  read endpoints (tracks, users, playlists, search, resolve). There is no API key, no plan tier, and
  no per-call charge. Self-hosting a discovery node is possible.
notes: Free, open-source, no API key required for public read endpoints.
sources:
- https://docs.audius.org/
- https://github.com/AudiusProject
plans:
- id: audius-public
  name: Public API
  type: free
  description: Free, unauthenticated public REST API for read access to the Audius catalog.
  entries:
  - label: API Access
    name: api_access
    type: flat
    metric: requests
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
  elements:
  - name: No API key for read endpoints
  - name: App-name header recommended for attribution
