specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Audius
providerId: audius
created: '2026-05-08'
modified: '2026-05-08'
reconciled: false
tags:
- Music
- Streaming
- Decentralized
- Web3
- Open Source
- Blockchain
- Rate Limiting
- Quotas
- Throttling
description: >-
  Audius hosts apply rate limits at the discovery-node level to prevent abuse, but the network is
  decentralized and individual host operators set their own thresholds. There is no documented global
  rate limit. Clients are encouraged to send an app-name header for attribution.
notes: Rate limits are per discovery node; not centrally documented. Use the SDK's host selection to spread load.
sources:
- https://docs.audius.org/developers/api
responseCodes:
  throttled: 429
limits:
- name: Per discovery node
  scope: host
  metric: requests
  limit: host-defined
  notes: Each network node sets its own limits.
policies:
- name: App Name Header
  description: Send the app_name query parameter on every request for attribution and to reduce throttling risk.
- name: Host Rotation
  description: Use the SDK or /health-check to rotate across discovery nodes.
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
