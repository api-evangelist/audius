description: >-
  FOCUS-aligned FinOps profile for Audius. The protocol is decentralized, open-source, and free to
  consume. There is no invoice from Audius for API usage. Cost only arises if you self-host a content
  node or discovery node (compute/storage on your infrastructure).
notes: Zero direct cost for API consumers; only self-hosting a node has cost (your own infra).
sources:
- https://docs.audius.org/
- https://github.com/AudiusProject
