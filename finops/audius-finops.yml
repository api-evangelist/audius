meters:
- name: api_requests
  description: API requests served by network discovery nodes (free; no charge).
  unit: request
  aggregation: sum
  dimensions:
  - app_name
  - host
principles:
- name: Visibility
  description: No invoice; track API usage in your own logs for performance tuning.
- name: Allocation
  description: If self-hosting nodes, allocate compute/storage to your team.
- name: Optimization
  description: Use the SDK's caching and host rotation to reduce per-host load.
- name: Accountability
  description: API consumers have no cost accountability; node operators do.
